# Synthetic calibration labels for turnjudge. Generated 2026-09-17.
#
# Every entry points at ~/Work/turnjudge-synthetic, a small three-language codebase (Python CLI,
# Go HTTP service, TypeScript client) built only to hold paired examples of proportionate versus
# over-engineered changes for the same task. Nothing here is real project history.
#
# Branch naming, all branched from main (the base commit):
#   simple/<n>     the proportionate change for scenario n: inline, a few lines, one helper at most
#   overbuilt/<n>  the over-engineered change for the same scenario n, same commit subject,
#                  still correct, but with a layer the task did not ask for
#   requested/<n>  the task itself asks for the structure, and the diff builds it (n = 13, 14, 15)
# The commit subject is the task sentence and stands in for `task`; there is no body.
#
# Fields:
#   verdict: clean | pushback   (would a careful reviewer merge this file's change without comment?)
#   labels.<score>: integer level 0..3 (verbosity 0..2), per the level text in questions.py
#   labels.<noul>:  yes | no
#   note: why, in one or two lines
#
# Simple branches are clean with unnecessary_complexity no. Overbuilt branches are pushback with
# unnecessary_complexity yes. Requested branches are clean with unnecessary_complexity no even where
# abstraction_added is 2 or 3. The one-line index.ts re-export files in overbuilt TypeScript commits
# are labeled pushback because they publish the unneeded layer, but their own scores are honest and low.


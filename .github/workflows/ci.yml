name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --quiet
      - run: uv run pytest -q
      # Live smoke and doctor need TYPESAFE_API_KEY as a repository secret; they are skipped without it.
      - run: uv run pytest -q tests/test_live.py
        env:
          TURNJUDGE_LIVE: ${{ secrets.TYPESAFE_API_KEY != '' && '1' || '0' }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
